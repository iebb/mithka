name: macOS TestFlight

# Archives Mithka for the Mac App Store and uploads the signed build directly
# to App Store Connect. Configure the following repository/environment secrets:
#
#   APP_STORE_CONNECT_KEY_ID
#   APP_STORE_CONNECT_ISSUER_ID
#   APP_STORE_CONNECT_PRIVATE_KEY         (contents of AuthKey_*.p8)
#   APPLE_TEAM_ID
#   TELEGRAM_API_ID
#   TELEGRAM_API_HASH
#   SENTRY_DSN                          (optional)
#
# Every push to master creates an internal TestFlight build. Manual dispatches
# can opt out of the permanent internal-only restriction when an external beta
# is intended.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      internal_testflight_only:
        description: Restrict this build permanently to internal TestFlight testers
        required: true
        type: boolean
        default: true

concurrency:
  group: macos-testflight
  cancel-in-progress: false

permissions:
  contents: read

env:
  TDJSON_RELEASE_TAG: tdlib-1.8.66-1b08c83bc078-rebuild-29623073124-1
  TDJSON_UPSTREAM_SHA: 1b08c83bc07888e4b0a6150d36c1364ff03cf930
  FVP_DEPS_URL: https://github.com/wang-bin/mdk-sdk/releases/download/v0.36.0

jobs:
  upload:
    name: Archive and upload macOS
    runs-on: macos-15
    timeout-minutes: 180
    environment: macos-testflight
    steps:
      - uses: actions/checkout@v5

      - name: Check out pinned Mithka TDLib patches
        uses: actions/checkout@v5
        with:
          repository: iebb/mithka-tdjson
          ref: ${{ env.TDJSON_RELEASE_TAG }}
          path: .tdlib-helper

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Install native build dependencies
        run: brew install cmake ninja

      - name: Restore macOS TDLib cache
        id: tdlib_cache
        uses: actions/cache/restore@v5
        with:
          path: .tdlib-build/desktop-macos
          key: tdjson-macos-universal-${{ env.TDJSON_RELEASE_TAG }}-${{ hashFiles('scripts/build-tdjson-desktop.sh') }}

      - name: Build patched universal TDLib
        env:
          NATIVE_HELPER_ROOT: .tdlib-helper
          TD_COMMIT: ${{ env.TDJSON_UPSTREAM_SHA }}
          TD_BUILD_JOBS: '2'
        run: scripts/build-tdjson-desktop.sh macos native-libs/libtdjson.dylib

      - name: Save macOS TDLib cache
        if: steps.tdlib_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .tdlib-build/desktop-macos
          key: tdjson-macos-universal-${{ env.TDJSON_RELEASE_TAG }}-${{ hashFiles('scripts/build-tdjson-desktop.sh') }}

      - name: Validate App Store credentials
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY TEAM_ID TELEGRAM_API_ID TELEGRAM_API_HASH; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required macOS TestFlight secret: $name" >&2
              exit 1
            fi
          done

      - name: Resolve release identity
        id: release
        env:
          DISPATCH_INTERNAL_ONLY: ${{ inputs.internal_testflight_only }}
        run: |
          raw_version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          app_version="${raw_version%%+*}"
          # Epoch seconds stay monotonic across GitHub Actions and Xcode Cloud,
          # and don't collide when a failed upload is retried within an hour.
          build_number="$(date -u '+%s')"
          short_sha="${GITHUB_SHA::7}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            internal_only="${DISPATCH_INTERNAL_ONLY:-true}"
          else
            internal_only=true
          fi
          case "$internal_only" in
            true|false) ;;
            *)
              echo "Invalid internal TestFlight flag: $internal_only" >&2
              exit 1
              ;;
          esac
          {
            echo "app_version=$app_version"
            echo "build_number=$build_number"
            echo "short_sha=$short_sha"
            echo "internal_only=$internal_only"
          } >> "$GITHUB_OUTPUT"

      - name: Configure Flutter project
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          flutter config --enable-swift-package-manager
          flutter pub get
          mkdir -p lib/config
          cat > lib/config/secrets.dart <<EOF
          class Secrets {
            static const int apiId = ${TELEGRAM_API_ID};
            static const String apiHash = '${TELEGRAM_API_HASH}';
            static bool get isConfigured => apiId != 0 && apiHash.isNotEmpty;
          }
          EOF
          flutter build macos --release --config-only \
            --build-name="${{ steps.release.outputs.app_version }}" \
            --build-number="${{ steps.release.outputs.build_number }}" \
            --dart-define="GIT_COMMIT=${{ steps.release.outputs.short_sha }}" \
            --dart-define="CI_BUILD_STAMP=${{ steps.release.outputs.build_number }}" \
            --dart-define="SENTRY_DSN=$SENTRY_DSN"

      - name: Install App Store Connect key
        id: auth
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          auth_dir="$RUNNER_TEMP/app-store-connect"
          mkdir -p "$auth_dir"
          key_path="$auth_dir/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "key_path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Archive Mac App Store build
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Mithka.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.auth.outputs.key_path }}" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic

      - name: Verify archived product
        run: |
          app="$RUNNER_TEMP/Mithka.xcarchive/Products/Applications/Mithka.app"
          test -d "$app"
          test -s "$app/Contents/Frameworks/libtdjson.dylib"
          test "$(lipo -archs "$app/Contents/Frameworks/libtdjson.dylib" | tr ' ' '\n' | sort | tr '\n' ' ')" = "arm64 x86_64 "
          codesign --verify --deep --strict "$app"
          # A clean CI runner can create an ad-hoc archive. App Store
          # distribution signing is applied by the authenticated export below.
          for nested_code in \
            "$app/Contents/Frameworks/libtdjson.dylib" \
            "$app/Contents/Frameworks/mdk.framework" \
            "$app/Contents/Frameworks/mdk.framework/Versions/A/"*.dylib; do
            codesign --verify --strict "$nested_code"
          done
          test "$(defaults read "$app/Contents/Info" CFBundleIdentifier)" = "ad.neko.mithka"
          test "$(defaults read "$app/Contents/Info" CFBundleShortVersionString)" = "${{ steps.release.outputs.app_version }}"
          test "$(defaults read "$app/Contents/Info" CFBundleVersion)" = "${{ steps.release.outputs.build_number }}"

      - name: Upload archive to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          INTERNAL_ONLY: ${{ steps.release.outputs.internal_only }}
        run: |
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$export_options" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
            <key>testFlightInternalTestingOnly</key><$INTERNAL_ONLY/>
          </dict></plist>
          EOF
          plutil -lint "$export_options"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Mithka.xcarchive" \
            -exportPath "$RUNNER_TEMP/Mithka-upload" \
            -exportOptionsPlist "$export_options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.auth.outputs.key_path }}" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Publish upload summary
        env:
          APP_VERSION: ${{ steps.release.outputs.app_version }}
          BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
          SHORT_SHA: ${{ steps.release.outputs.short_sha }}
          INTERNAL_ONLY: ${{ steps.release.outputs.internal_only }}
        run: |
          {
            echo '### macOS App Store Connect delivery'
            echo ''
            echo "- Version: $APP_VERSION"
            echo "- Build: $BUILD_NUMBER"
            echo "- Commit: $SHORT_SHA"
            echo "- Internal TestFlight only: $INTERNAL_ONLY"
            echo '- Bundle ID: ad.neko.mithka'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove App Store Connect key
        if: always()
        run: rm -f "${{ steps.auth.outputs.key_path }}"
