name: Mithka video player

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/mithka-video-player.yml"
      - "packages/mithka_video_player/**"
      - "packages/mithka_video_player_fvp/**"
      - "third_party/fvp/**"
      - "lib/app/desktop_video_window.dart"
      - "lib/main.dart"
      - "macos/Runner.xcodeproj/project.pbxproj"
      - "pubspec.yaml"
      - "pubspec.lock"
  push:
    branches: [master]
    paths:
      - ".github/workflows/mithka-video-player.yml"
      - "packages/mithka_video_player/**"
      - "packages/mithka_video_player_fvp/**"
      - "third_party/fvp/**"
      - "lib/app/desktop_video_window.dart"
      - "lib/main.dart"
      - "macos/Runner.xcodeproj/project.pbxproj"
      - "pubspec.yaml"
      - "pubspec.lock"

permissions:
  contents: read

concurrency:
  group: mithka-video-player-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.2
  PACKAGE_DIR: packages/mithka_video_player
  ADAPTER_DIR: packages/mithka_video_player_fvp
  EXAMPLE_DIR: packages/mithka_video_player/example

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve package dependencies
        working-directory: ${{ env.PACKAGE_DIR }}
        run: flutter pub get
      - name: Analyze package
        working-directory: ${{ env.PACKAGE_DIR }}
        run: flutter analyze --fatal-infos
      - name: Test package
        working-directory: ${{ env.PACKAGE_DIR }}
        run: flutter test
      - name: Resolve FVP adapter dependencies
        working-directory: ${{ env.ADAPTER_DIR }}
        run: flutter pub get
      - name: Analyze FVP adapter
        working-directory: ${{ env.ADAPTER_DIR }}
        run: flutter analyze --fatal-infos
      - name: Test FVP adapter
        working-directory: ${{ env.ADAPTER_DIR }}
        run: flutter test
      - name: Resolve example dependencies
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: flutter pub get
      - name: Analyze example
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: flutter analyze --fatal-infos
      - name: Test example
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: flutter test

  web:
    name: Web example
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build web example
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: flutter build web --release

  android:
    name: Android example
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build Android example
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: flutter build apk --debug

  ios:
    name: iOS simulator example
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager
      - name: Build iOS simulator example
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: flutter build ios --simulator --debug

  desktop:
    name: ${{ matrix.name }} example
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            command: flutter build linux --debug
          - name: macOS
            os: macos-latest
            command: flutter build macos --debug
          - name: Windows
            os: windows-latest
            command: flutter build windows --debug
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libjpeg-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Enable Swift Package Manager
        if: runner.os == 'macOS'
        run: flutter config --enable-swift-package-manager
      - name: Build desktop example
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: ${{ matrix.command }}
