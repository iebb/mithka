name: 🌙 Sync Nightly

# Merge master into nightly once per day. Every sync that incorporates new
# master commits increments the app's patch version once. Master is
# authoritative for the nightly tree; only pubspec.yaml receives a generated
# nightly version. A generated GITHUB_TOKEN push doesn't trigger other
# workflows, so a changed sync explicitly dispatches every build that a push to
# nightly is meant to produce: the GitHub prerelease, the Google Play beta, and
# the iOS and macOS TestFlight uploads. Those four subscribe to pushes on
# nightly, which is what covers a human push; only this dispatch covers the
# scheduled sync.

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      summary_only:
        description: Compare published releases and summarize current nightly without syncing or dispatching builds
        type: boolean
        default: false

concurrency:
  group: sync-nightly
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  quality:
    name: Required quality gate
    if: inputs.summary_only != true
    uses: ./.github/workflows/quality.yml

  sync:
    name: Sync master to nightly
    needs: quality
    if: inputs.summary_only != true
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      nightly_commit: ${{ steps.sync.outputs.nightly_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Merge changed master into a versioned nightly
        id: sync
        run: |
          git fetch origin master
          master_raw="$(git show origin/master:pubspec.yaml | awk '/^version:/ { print $2; exit }')"
          test -n "$master_raw"
          master_android_version_code="$(
            git show origin/master:android/version-code.txt | tr -d '\r\n'
          )"
          case "$master_android_version_code" in
            ''|*[!0-9]*) echo "Invalid master Android version code" >&2; exit 1 ;;
          esac

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin nightly >/dev/null 2>&1; then
            git fetch origin nightly
            if git merge-base --is-ancestor origin/master origin/nightly; then
              {
                echo "changed=false"
                echo "nightly_commit=$(git rev-parse origin/nightly)"
              } >> "$GITHUB_OUTPUT"
              echo "nightly already contains the current master"
              exit 0
            fi

            previous_raw="$(git show origin/nightly:pubspec.yaml | awk '/^version:/ { print $2; exit }')"
            test -n "$previous_raw"
            if previous_android_version_code="$(
              git show origin/nightly:android/version-code.txt 2>/dev/null
            )"; then
              previous_android_version_code="$(
                printf '%s' "$previous_android_version_code" | tr -d '\r\n'
              )"
            else
              previous_android_version_code="$master_android_version_code"
            fi
            git checkout -B nightly origin/nightly
            # Record both histories without asking Git to reconcile two trees
            # that may contain generated or backported nightly changes. Then
            # replace the staged tree with master's exact contents. This keeps
            # master authoritative and makes merge conflicts impossible while
            # retaining both parents for the next ancestry check.
            git merge --no-commit --no-ff --strategy=ours origin/master
            git read-tree --reset -u origin/master
          else
            previous_raw="$master_raw"
            previous_android_version_code="$master_android_version_code"
            git checkout -B nightly origin/master
          fi

          case "$previous_android_version_code" in
            ''|*[!0-9]*) echo "Invalid previous nightly Android version code" >&2; exit 1 ;;
          esac

          master_semver="${master_raw%%+*}"
          previous_semver="${previous_raw%%+*}"
          IFS=. read -r master_major master_minor master_patch master_extra <<< "$master_semver"
          IFS=. read -r previous_major previous_minor previous_patch previous_extra <<< "$previous_semver"
          for component in "$master_major" "$master_minor" "$master_patch" \
            "$previous_major" "$previous_minor" "$previous_patch"; do
            case "$component" in
              ''|*[!0-9]*) echo "Invalid app version component: $component" >&2; exit 1 ;;
            esac
          done
          if [ -n "$master_extra" ] || [ -n "$previous_extra" ]; then
            echo "Expected X.Y.Z versions, got $master_semver and $previous_semver" >&2
            exit 1
          fi

          if [ "$master_major" = "$previous_major" ] && \
            [ "$master_minor" = "$previous_minor" ] && \
            [ "$previous_patch" -ge "$master_patch" ]; then
            nightly_patch=$((previous_patch + 1))
          else
            nightly_patch=$((master_patch + 1))
          fi
          nightly_version="$master_major.$master_minor.$nightly_patch"
          case "$master_raw" in
            *+*) nightly_raw="$nightly_version+${master_raw#*+}" ;;
            *) nightly_raw="$nightly_version" ;;
          esac

          android_version_code=$((master_android_version_code + 1))
          if [ "$previous_android_version_code" -ge "$android_version_code" ]; then
            android_version_code=$((previous_android_version_code + 1))
          fi
          current_epoch="$(date -u '+%s')"
          if [ "$current_epoch" -gt "$android_version_code" ]; then
            android_version_code="$current_epoch"
          fi

          sed -i -E "s/^version:.*/version: $nightly_raw/" pubspec.yaml
          printf '%s\n' "$android_version_code" > android/version-code.txt
          test "$(awk '/^version:/ { print $2; exit }' pubspec.yaml)" = "$nightly_raw"
          test "$(bash scripts/android-version-code.sh)" = "$android_version_code"
          git add pubspec.yaml android/version-code.txt
          unexpected="$(
            git diff --name-only origin/master -- \
              | grep -Ev '^(pubspec.yaml|android/version-code.txt)$' \
              || true
          )"
          if [ -n "$unexpected" ]; then
            echo "nightly differs from master outside generated release metadata:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          git diff --check --cached
          git commit -m "chore: sync nightly $nightly_version"
          git push origin HEAD:nightly
          {
            echo "changed=true"
            echo "nightly_commit=$(git rev-parse HEAD)"
            echo "nightly_version=$nightly_version"
          } >> "$GITHUB_OUTPUT"
          echo "nightly now contains master at app version $nightly_raw; Android version code $android_version_code"

      - name: Dispatch nightly releases
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml --ref nightly
          gh workflow run google-play.yml --ref nightly
          gh workflow run ios-testflight.yml --ref nightly
          gh workflow run macos-testflight.yml --ref nightly

  release-summary:
    name: Summarize changes since the previous release
    needs: [quality, sync]
    if: >-
      always() && github.repository == 'iebb/mithka' && github.ref == 'refs/heads/master' &&
      (inputs.summary_only == true || (needs.quality.result == 'success' && needs.sync.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Execute trusted master code. The nightly source is read only as data.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test release-summary and Actions-output boundaries
        run: |
          node --test .github/scripts/nightly-summary.test.mjs
          python3 -m unittest discover -s test/scripts -p 'pr_review_output_test.py' -v
      - name: Resolve the exact nightly source
        id: source
        env:
          SYNC_COMMIT: ${{ needs.sync.outputs.nightly_commit }}
          SUMMARY_ONLY: ${{ inputs.summary_only }}
        run: |
          set -euo pipefail
          target="$SYNC_COMMIT"
          if [ "$SUMMARY_ONLY" = true ]; then
            git fetch --no-tags origin nightly
            target="$(git rev-parse FETCH_HEAD)"
          fi
          [[ "$target" =~ ^[a-f0-9]{40}$ ]]
          git cat-file -e "$target^{commit}"
          raw_version="$(git show "$target:pubspec.yaml" | awk '/^version:/ { print $2; exit }')"
          [[ "$raw_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]
          echo "commit=$target" >> "$GITHUB_OUTPUT"
          echo "version=$raw_version" >> "$GITHUB_OUTPUT"
      - name: Write the release comparison summary
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NIGHTLY_SUMMARY_COMMIT: ${{ steps.source.outputs.commit }}
          NIGHTLY_VERSION: ${{ steps.source.outputs.version }}
          NIGHTLY_CHANGED: ${{ inputs.summary_only == true && 'true' || needs.sync.outputs.changed }}
        run: node .github/scripts/nightly-summary.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: nightly-release-summary
          path: nightly-summary/
          if-no-files-found: error
          retention-days: 30
