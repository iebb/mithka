name: mithka
description: "Mithka — a cross-platform Telegram client (Flutter), built on TDLib."
publish_to: 'none'
version: 0.7.30+281

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management — mirrors SwiftUI's ObservableObject / @Published.
  provider: ^6.1.2

  # Persisted preferences (UserDefaults equivalent).
  shared_preferences: ^2.3.2

  # TDLib database / files directory (applicationSupportDirectory equivalent).
  path_provider: ^2.1.4

  # FFI bindings to tdjson (td_create_client_id / td_send / td_receive / td_execute).
  ffi: ^2.1.3

  # Chinese day-period date formatting.
  intl: 0.20.2

  # Animated .tgs stickers (gzipped Lottie JSON).
  lottie: ^3.5.1
  archive: ^4.0.9

  # Voice notes: record + play Telegram's OGG/Opus (bundles libopus, so it works
  # on iOS where AVFoundation can't decode Opus). + mic permission.
  audio_session: ^0.2.4
  # 9.30.0 advertises desktop plugins whose native registration metadata is
  # incomplete (including a mismatched macOS podspec). Keep the last mobile-
  # only release so desktop builds compile and voice notes remain mobile-only.
  flutter_sound: 9.28.0
  logger: ^2.7.0
  permission_handler: ^12.0.3

  # Media pickers for the composer's + panel: photos/camera, documents, location.
  image_picker: ^1.2.3
  camera: ^0.12.0+2
  file_picker: ^11.0.2
  # 14.x pulls package_info_plus 10/win32 6, incompatible with stable
  # file_picker 11's win32 5 constraint.
  geolocator: ^13.0.4

  # QR business card (二维码名片) rendering.
  qr_flutter: ^4.1.0

  # Proper international phone-number formatting (pure-Dart libphonenumber port).
  dlibphonenumber: ^1.1.68

  # Open downloaded files in the system viewer; open external (non-t.me) links.
  open_filex: ^4.5.0
  url_launcher: ^6.3.1

  # Map-based location picker (OpenStreetMap tiles — no API key required).
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  apple_maps_flutter: ^1.4.0

  # Animated .webm (VP9 + alpha) video stickers. fvp is an MDK/FFmpeg backend for
  # video_player that decodes VP8/VP9 transparent WebM (Telegram video stickers) —
  # replaces the old ffmpeg_kit→WebP transcode.
  video_player: ^2.13.0
  # Independent native video windows on macOS, Windows, and Linux.
  multi_window_manager: ^1.3.0
  # Story video preparation: native 60-second segmentation and mobile-friendly
  # re-encoding before TDLib's inputStoryContentVideo upload.
  light_compressor_v2: ^1.9.0
  video_thumbnail_gen: ^0.6.3
  fvp: ^0.37.2
  system_picture_in_picture:
    path: third_party/system_picture_in_picture
  flutter_local_notifications: ^22.2.0
  google_fonts: ^8.2.0
  firebase_core: ^4.12.1
  firebase_analytics: ^12.4.5
  # 10.x requires win32 6, while stable file_picker 11 still requires win32 5.
  package_info_plus: ^9.0.1
  sentry_flutter: ^9.25.0
  http: ^1.6.0
  crypto: ^3.0.6
  flutter_svg: ^2.3.0
  vector_graphics: ^1.2.2
  image: ^4.9.1
  # Accelerometer-backed parallax for Telegram wallpaper Motion.
  sensors_plus: ^7.1.0
  heroicons_flutter: ^0.5.0
  mobile_scanner: ^7.4.0
  flutter_math_fork: ^0.7.4
  wechat_assets_picker: ^10.1.3
  photo_manager: ^3.11.0
  flutter_secure_storage: ^10.3.1
  webview_flutter: ^4.14.0
  webview_flutter_android: ^4.13.0
  webview_flutter_wkwebview: ^3.26.0
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generates iOS/Android launcher icons from the Drachma app icon.
  flutter_launcher_icons: ^0.14.1

dependency_overrides:
  fvp:
    path: third_party/fvp

flutter_launcher_icons:
  image_path: "assets/app_icon.png"
  ios: true
  android: true
  remove_alpha_ios: true
flutter:
  uses-material-design: true
  assets:
    - assets/penguin.png
    - assets/app_icon.png
    - assets/app_icons/
    - assets/emoji_preview/
    - assets/message_bubbles/
