name: mithka_proxy
description: Mithka's trimmed in-process Leaf proxy and WebView routing bridge.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.12.2
  flutter: '>=3.44.2'
dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  hooks: ^2.0.2
  code_assets: ^1.2.1
  path: ^1.9.1
flutter:
  plugin:
    platforms:
      android:
        package: ad.neko.mithka.proxy
        pluginClass: MithkaProxyPlugin
      ios:
        pluginClass: MithkaProxyPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: MithkaProxyPlugin
        sharedDarwinSource: true
