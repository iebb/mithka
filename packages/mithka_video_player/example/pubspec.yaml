name: mithka_video_player_example
description: Embedded and independent-window examples for mithka_video_player.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  # FVP must be direct for its native assets on Flutter 3.27 and newer.
  fvp: ^0.37.3
  flutter:
    sdk: flutter
  mithka_video_player:
    path: ../
  mithka_video_player_fvp:
    path: ../../mithka_video_player_fvp
  video_player: ^2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # Repository-only: compile-smoke the exact Mithka FVP fork used by the host
  # app. Consumers of the optional adapter continue to resolve hosted FVP.
  fvp:
    path: ../../../third_party/fvp

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: false
