  flutter:
    sdk: flutter
  multi_window_manager: ^1.3.0
  video_player: ^2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
